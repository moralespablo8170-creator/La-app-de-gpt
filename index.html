<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json"><title>Comprobantes | Distribuidora zipper</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app"><header class="header"><div><p class="eyebrow">DISTRIBUIDORA ZIPPER</p><h1>Comprobantes</h1></div><button class="secondary" id="printBtn" type="button">Imprimir / PDF</button></header>
<nav class="tabs"><button class="tab active" id="newTab" type="button">Nuevo</button><button class="tab" id="historyTab" type="button">Historial</button><button class="tab" id="clientsTab" type="button">Clientes</button></nav>
<section id="newView"><section class="card"><div class="grid two"><label>Cliente<select id="clienteSelect"><option value="">Selecciona un cliente</option></select></label><label>Fecha<input id="fecha" type="date"></label></div><div class="grid two"><label>Comprobante N.º<input id="folio" type="number" min="1" step="1"></label><label>Vendedor<input id="vendedor" placeholder="Nombre" maxlength="120" autocomplete="name"></label></div></section>
<section class="card"><div class="section-title"><h2>Productos</h2><button class="primary" id="addBtn" type="button">+ Agregar</button></div><div id="items"></div><div class="total-row"><span>Total</span><strong id="total">$0</strong></div></section>
<section class="card"><label>Observaciones<textarea id="observaciones" rows="3" maxlength="500" placeholder="Notas del comprobante"></textarea></label></section>
<div class="actions"><button class="primary wide" id="saveBtn" type="button">Guardar comprobante</button><button class="secondary wide" id="clearBtn" type="button">Limpiar</button></div><p class="status" id="status"></p></section>
<section class="print-receipt hidden" id="printReceipt"></section>
<section class="card hidden" id="historyView"><div class="section-title"><h2>Historial</h2><button class="secondary" id="clearHistoryBtn" type="button">Borrar historial</button></div><div class="history-filters"><input id="search" placeholder="Buscar por cliente, número, vendedor u observación"><label>Desde<input id="historyFrom" type="date"></label><label>Hasta<input id="historyTo" type="date"></label><button class="secondary" id="clearHistoryFilters" type="button">Limpiar filtros</button></div><div class="history-summary"><div><span>Comprobantes</span><strong id="historyCount">0</strong></div><div><span>Total vendido</span><strong id="historyTotal">$0</strong></div></div><div id="historyList" class="history-list"></div></section>
<section class="card hidden" id="clientsView"><div class="section-title"><h2>Clientes</h2></div><div class="actions"><button class="secondary wide" id="exportBtn" type="button">Descargar respaldo</button><button class="secondary wide" id="importBtn" type="button">Restaurar respaldo</button><input id="importFile" type="file" accept="application/json" class="hidden"></div><p class="muted">El respaldo incluye clientes y comprobantes guardados en este dispositivo.</p><div class="grid two"><label>Nombre / Empresa<input id="clientName" placeholder="Nombre del cliente" maxlength="120" autocomplete="organization"></label><label>RUT<input id="clientRut" placeholder="14.171.028-1" maxlength="12" inputmode="text" autocomplete="off"></label></div><div class="grid two"><label>Teléfono<div class="phone-input"><span>569</span><input id="clientPhone" placeholder="7567 6799" maxlength="9" inputmode="tel" autocomplete="tel"></div></label><label>Dirección<input id="clientAddress" placeholder="Dirección" maxlength="200" autocomplete="street-address"></label></div><div class="actions"><button class="primary wide" id="saveClientBtn" type="button">Guardar cliente</button><button class="secondary wide hidden" id="cancelClientEditBtn" type="button">Cancelar edición</button></div><p class="status" id="clientStatus"></p><input id="clientSearch" placeholder="Buscar cliente" class="client-search"><div class="client-filters"><button class="secondary client-filter active" data-filter="all" type="button">Todos</button><button class="secondary client-filter" data-filter="active" type="button">Activos</button><button class="secondary client-filter" data-filter="inactive" type="button">Inactivos</button></div><div id="clientList" class="history-list"></div></section>
</section><script src="app.js"></script></main></body></html>
