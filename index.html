<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Comprobantes | Distribuidora zipper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">DISTRIBUIDORA ZIPPER</p>
        <h1>Nuevo comprobante</h1>
      </div>
      <button class="secondary" id="printBtn" type="button">Imprimir / PDF</button>
    </header>

    <section class="card">
      <div class="grid two">
        <label>Cliente<input id="cliente" placeholder="Nombre del cliente"></label>
        <label>Fecha<input id="fecha" type="date"></label>
      </div>
      <div class="grid two">
        <label>Comprobante N.º<input id="folio" type="number" min="1"></label>
        <label>Vendedor<input id="vendedor" placeholder="Nombre"></label>
      </div>
    </section>

    <section class="card">
      <div class="section-title"><h2>Productos</h2><button class="primary" id="addBtn" type="button">+ Agregar</button></div>
      <div id="items"></div>
      <div class="total-row"><span>Total</span><strong id="total">$0</strong></div>
    </section>

    <section class="card">
      <label>Observaciones<textarea id="observaciones" rows="3" placeholder="Notas del comprobante"></textarea></label>
    </section>

    <div class="actions">
      <button class="primary wide" id="saveBtn" type="button">Guardar comprobante</button>
      <button class="secondary wide" id="clearBtn" type="button">Limpiar</button>
    </div>

    <p class="status" id="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
