<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Comprobantes | Distribuidora zipper</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app"><header class="header"><div><p class="eyebrow">DISTRIBUIDORA ZIPPER</p><h1>Comprobantes</h1></div><button class="secondary" id="printBtn" type="button">Imprimir / PDF</button></header>
<nav class="tabs"><button class="tab active" id="newTab" type="button">Nuevo</button><button class="tab" id="historyTab" type="button">Historial</button><button class="tab" id="clientsTab" type="button">Clientes</button></nav>
<section id="newView"><section class="card"><div class="grid two"><label>Cliente<select id="clienteSelect"><option value="">Selecciona un cliente</option></select></label><label>Fecha<input id="fecha" type="date"></label></div><div class="grid two"><label>Comprobante N.º<input id="folio" type="number" min="1"></label><label>Vendedor<input id="vendedor" placeholder="Nombre"></label></div></section>
<section class="card"><div class="section-title"><h2>Productos</h2><button class="primary" id="addBtn" type="button">+ Agregar</button></div><div id="items"></div><div class="total-row"><span>Total</span><strong id="total">$0</strong></div></section>
<section class="card"><label>Observaciones<textarea id="observaciones" rows="3" placeholder="Notas del comprobante"></textarea></label></section>
<div class="actions"><button class="primary wide" id="saveBtn" type="button">Guardar comprobante</button><button class="secondary wide" id="clearBtn" type="button">Limpiar</button></div><p class="status" id="status"></p></section>
<section class="card hidden" id="historyView"><div class="section-title"><h2>Historial</h2><button class="secondary" id="clearHistoryBtn" type="button">Borrar historial</button></div><input id="search" placeholder="Buscar por cliente o número"><div id="historyList" class="history-list"></div></section>
<section class="card hidden" id="clientsView"><div class="section-title"><h2>Clientes</h2></div><div class="grid two"><label>Nombre / Empresa<input id="clientName" placeholder="Nombre del cliente"></label><label>RUT<input id="clientRut" placeholder="12.345.678-9"></label></div><div class="grid two"><label>Teléfono<input id="clientPhone" placeholder="+56 9..."></label><label>Dirección<input id="clientAddress" placeholder="Dirección"></label></div><button class="primary wide" id="saveClientBtn" type="button">Guardar cliente</button><p class="status" id="clientStatus"></p><input id="clientSearch" placeholder="Buscar cliente" class="client-search"><div id="clientList" class="history-list"></div></section>
</section><script src="app.js"></script></main></body></html>
