name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main app
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-src

      # Keep the local main app, an isolated test preview, and a production Firebase app route.
      - name: Checkout Firebase app
        uses: actions/checkout@v6
        with:
          ref: firebase/secure-foundation-zipper
          path: preview-src

      - name: Assemble main app, isolated preview, and Firebase app
        run: |
          mkdir -p _site/preview/pr-9 _site/firebase
          cp -a main-src/. _site/
          rm -rf _site/.git
          cp -a preview-src/. _site/preview/pr-9/
          rm -rf _site/preview/pr-9/.git
          cp -a preview-src/. _site/firebase/
          rm -rf _site/firebase/.git
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/preview/pr-9/index.html
          test -f _site/firebase/index.html

      - name: Bundle Firebase SDK for the main app, preview, and production Firebase app
        run: |
          mkdir -p /tmp/zipper-firebase-build/main /tmp/zipper-firebase-build/preview
          cp _site/firebase-cloud.js /tmp/zipper-firebase-build/main/firebase-cloud-entry.js
          cp _site/firebase-config.js /tmp/zipper-firebase-build/main/firebase-config.js
          cp _site/firebase-test-config.js /tmp/zipper-firebase-build/main/firebase-test-config.js
          cp _site/preview/pr-9/firebase-cloud.js /tmp/zipper-firebase-build/preview/firebase-cloud-entry.js
          cp _site/preview/pr-9/firebase-config.js /tmp/zipper-firebase-build/preview/firebase-config.js
          cp _site/preview/pr-9/firebase-test-config.js /tmp/zipper-firebase-build/preview/firebase-test-config.js
          npm install --prefix /tmp/zipper-firebase-build --no-save firebase@13.1.0 esbuild@0.25.0
          /tmp/zipper-firebase-build/node_modules/.bin/esbuild /tmp/zipper-firebase-build/main/firebase-cloud-entry.js --bundle --platform=browser --format=esm --target=es2022 --outfile=_site/firebase-cloud.js
          /tmp/zipper-firebase-build/node_modules/.bin/esbuild /tmp/zipper-firebase-build/preview/firebase-cloud-entry.js --bundle --platform=browser --format=esm --target=es2022 --outfile=_site/preview/pr-9/firebase-cloud.js
          cp _site/preview/pr-9/firebase-cloud.js _site/firebase/firebase-cloud.js
          # Preserve the main app's own Firebase bundle; do not overwrite it with preview.

      - name: Prepare independent Zipper installation
        run: |
          mkdir -p _site/zipper-nueva
          cp _site/index.html _site/styles.css _site/app.js _site/pwa.js _site/sw.js _site/firebase-cloud.js _site/firebase-config.js _site/firebase-test-config.js _site/seller-assignments.js _site/seller-app.js _site/seller-admin.js _site/seller-admin.html _site/vendedor.html _site/route-position-migration.js _site/route-position-migration-b.js _site/herramientas.js _site/manifest.json _site/zipper-nueva/
          cp -a _site/assets _site/data _site/zipper-nueva/
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('_site/zipper-nueva/manifest.json')
          manifest=json.loads(path.read_text())
          manifest.update({'id':'./zipper-nueva-20261102','name':'Zipper Nueva','short_name':'Zipper Nueva','start_url':'./?instalacion=zipper-nueva-20261102','scope':'./'})
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          html=Path('_site/zipper-nueva/index.html')
          content=html.read_text().replace('Versión 01-11-2026 · Firebase integrado','Versión 02-11-2026 · instalación nueva')
          content=content.replace('./manifest.json?v=20261015-icono-exterior-v2','./manifest.json?v=zipper-nueva-20261102')
          html.write_text(content)
          sw=Path('_site/zipper-nueva/sw.js')
          sw.write_text(sw.read_text().replace('zipper-app-pwa-20261101-chrome-update-20','zipper-new-pwa-20261102-1').replace("key.startsWith('zipper-app-')","key.startsWith('zipper-new-')"))
          PY
          test -f _site/zipper-nueva/index.html
          test -f _site/zipper-nueva/firebase-cloud.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
