name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - firebase/secure-foundation-zipper
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main app
        uses: actions/checkout@v6
        with:
          ref: main
          path: main-src

      - name: Checkout Firebase preview
        uses: actions/checkout@v6
        with:
          ref: firebase/secure-foundation-zipper
          path: preview-src

      - name: Assemble production app and isolated preview
        run: |
          mkdir -p _site/preview/pr-9
          cp -a main-src/. _site/
          rm -rf _site/.git
          cp -a preview-src/. _site/preview/pr-9/
          rm -rf _site/preview/pr-9/.git
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/preview/pr-9/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
