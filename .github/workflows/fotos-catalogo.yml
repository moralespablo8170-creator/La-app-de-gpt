name: Fotos del catálogo (descargar)

# Descarga las fotos listadas en catalogo/fotos-web.txt, las recorta y cuadra en blanco,
# y las deja en catalogo/img-web/ para revisarlas antes de usarlas.
on:
  push:
    paths: [catalogo/fotos-web.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Descargar y preparar fotos
        run: |
          pip install --quiet pillow
          mkdir -p catalogo/img-web
          python3 - <<'PY'
          import io, re, urllib.request
          from PIL import Image, ImageChops
          ok, bad = 0, []
          for line in open('catalogo/fotos-web.txt', encoding='utf-8'):
              line = line.strip()
              if not line or line.startswith('#') or '|' not in line: continue
              key, url = [x.strip() for x in line.split('|', 1)]
              if not re.fullmatch(r'[a-z0-9-]+', key): bad.append(key); continue
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36', 'Accept': 'image/*'})
                  im = Image.open(io.BytesIO(urllib.request.urlopen(req, timeout=30).read())).convert('RGB')
                  bg = Image.new('RGB', im.size, (255, 255, 255))
                  box = ImageChops.difference(im, bg).convert('L').point(lambda p: 255 if p > 18 else 0).getbbox()
                  if box: im = im.crop(box)
                  w, h = im.size; side = int(max(w, h) * 1.08)
                  sq = Image.new('RGB', (side, side), (255, 255, 255)); sq.paste(im, ((side - w) // 2, (side - h) // 2))
                  sq.resize((380, 380), Image.LANCZOS).save(f'catalogo/img-web/{key}.jpg', 'JPEG', quality=78, optimize=True)
                  ok += 1; print('OK', key, im.size)
              except Exception as e:
                  bad.append(key); print('FALLÓ', key, e)
          print(ok, 'fotos listas;', len(bad), 'fallaron:', bad)
          PY
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add catalogo/img-web
          git diff --cached --quiet && echo "Sin cambios" || (git commit -m "Fotos del catálogo descargadas" && git push)
