name: Zipper branch checks
on:
  push:
    branches: [revision-duplicados-20261010]
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check-static.mjs
      - run: node tests/check-migration-runtime.mjs
      - run: node tests/check-backup-runtime.mjs
      - run: node tests/check-sales-arithmetic.mjs
      - run: node tests/check-sale-routes.mjs
      - run: node tests/check-sale-inventory.mjs
      - run: node tests/check-debt-runtime.mjs
      - run: node tests/check-visits-runtime.mjs
