<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corregir stock Alca</title><style>body{font:18px system-ui;padding:24px;max-width:520px;margin:auto;background:#f3f4f6}button,a{display:block;padding:18px;margin:20px 0;border-radius:12px;font:inherit}button{width:100%;background:#2563eb;color:white;border:0}p{line-height:1.5}</style><h1>Corregir Alca y Alcaeis</h1><p>El inventario registrado en el código indica Alka: 34 unidades y Alka Ice: 4 unidades. Esta corrección solo ajusta estos dos productos; conserva las ventas en cero y el resto del inventario.</p><p>Cierra las otras pestañas de la app antes de continuar.</p><div id="details"></div><p id="status" style="background:#fff3cd;border:2px solid #d97706;padding:16px;font-weight:bold" aria-live="polite"></p><button id="fix">Restablecer Alca 34 y Alcaeis 4</button><a href="./">Volver a la aplicación</a><script>
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const classify=name=>{const n=String(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();if(/^(alka|alca)\s*(ice|eis|ais)(?:\b|\d)/.test(n))return 1;if(/^(alka|alca)(?:\s|$)/.test(n)&&! /^(alka|alca)\s*2\b/.test(n))return 0;return -1};
const specs=[{names:['alka','alca'],qty:34},{names:['alkaice','alcaice','alcaeis','alkaeis','alcaais','alkaais'],qty:4}];
function plan(ps){if(!Array.isArray(ps))throw Error('No se pudo leer el inventario.');return specs.flatMap((s,index)=>{const found=ps.filter(p=>classify(p.name)===index);if(!found.length)throw Error('No se encontró '+s.names[0]+'. Abre este enlace en el navegador donde usas la app.');return found.map(p=>({id:p.id,name:p.name,old:p.stock,qty:s.qty}))})}
const status=document.getElementById('status'),button=document.getElementById('fix');let raw,rows;
try{raw=localStorage.getItem('zipperProductos');rows=plan(JSON.parse(raw||'null'));for(const r of rows){const p=document.createElement('p');p.textContent=r.name+': '+r.old+' → '+r.qty+' unidades';document.getElementById('details').appendChild(p)}if(rows.every(r=>Number(r.old)===r.qty)){status.textContent='Ambos productos ya tienen el stock indicado.';button.textContent='Verificar stock y volver a guardar'}}catch(e){status.textContent=e.message;button.textContent='Revisar datos otra vez'}
button.onclick=()=>{if(!rows){alert(status.textContent);return}if(!confirm('¿Restablecer únicamente Alca a 34 y Alcaeis a 4 unidades?'))return;button.disabled=true;try{if(localStorage.getItem('zipperProductos')!==raw)throw Error('El inventario cambió. Recarga esta página.');localStorage.setItem('zipperRespaldoAlcaAntesCorreccion',raw);const ps=JSON.parse(raw);for(const r of rows){const p=ps.find(p=>String(p.id)===String(r.id));p.stock=r.qty}localStorage.setItem('zipperProductos',JSON.stringify(ps));const verified=plan(JSON.parse(localStorage.getItem('zipperProductos')));if(!verified.every(r=>Number(r.old)===r.qty))throw Error('No se pudo verificar la corrección.');status.textContent='Guardado y verificado: Alca 34; Alcaeis 4. Vuelve a la aplicación.';button.hidden=true}catch(e){status.textContent=e.message;button.disabled=false}};
</script></html>
