<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Limpieza y prueba</title><style>body{font-family:system-ui,sans-serif;padding:20px}input{display:block;width:100%;box-sizing:border-box;padding:15px;font-size:18px;margin:12px 0 20px}#msg{padding:12px;border-radius:8px;background:#eee}</style></head><body><h2>Prueba limpia</h2><div id="msg">Eliminando caché y Service Worker...</div><div id="form" hidden><label>Escribe PRUEBA<input type="text" autocomplete="off"></label><label>Escribe 123<input type="text" inputmode="numeric" autocomplete="off"></label></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}document.getElementById('msg').textContent='Limpieza terminada. Si esta página se recargó, prueba escribir ahora.';document.getElementById('form').hidden=false}catch(e){document.getElementById('msg').textContent='Limpieza terminada con aviso. Prueba igualmente.';document.getElementById('form').hidden=false}})();</script></body></html>
