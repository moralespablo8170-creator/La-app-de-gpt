<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba Fun Print · Zipper</title><style>body{font-family:system-ui;background:#f3f4f6;color:#111827;padding:20px;max-width:480px;margin:auto}main{background:white;padding:22px;border-radius:16px}button{width:100%;padding:18px;background:#1265c8;color:white;border:0;border-radius:12px;font-size:19px;font-weight:bold}p{line-height:1.5}.note{background:#fff4d7;padding:12px;border-radius:8px}#status{font-weight:600}</style></head><body><main><h1>Distribuidora Zipper</h1><h2>Prueba de impresión Fun Print</h2><p class="note">Esta página es independiente de la aplicación. No registra ventas, no cambia inventario y no guarda comprobantes.</p><p>Ticket de muestra: Luis Mellado · OCB Negro $13.000 · Amsterdam papelillo con boquilla $15.000 · Total $28.000.</p><button id="print">Compartir ticket con Fun Print</button><p id="status" role="status"></p></main><script>
function pdf(){const lines=[['DISTRIBUIDORA ZIPPER',12],['Comprobante #19',11],['06-10-2026',11],['',8],['Luis Mellado (el huaso)',11],['',8],['OCB Negro',12],['1 x $13.000',11],['= $13.000',12],['',6],['Amsterdam papelillo',12],['con boquilla',12],['1 x $15.000',11],['= $15.000',12],['',6],['TOTAL: $28.000',14]];const w=164.41,h=lines.reduce((a,l)=>a+l[1]*1.35+2,20),x=10;let y=h-12,stream='';for(const [t,z] of lines){if(t)stream+='BT /F1 '+z+' Tf 1 0 0 1 '+x+' '+y.toFixed(2)+' Tm ('+t.replace(/[\\()]/g,c=>'\\'+c)+') Tj ET\n';y-=z*1.35+2}const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+w+' '+h.toFixed(2)+'] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>','<< /Length '+stream.length+' >>\nstream\n'+stream+'endstream'];let s='%PDF-1.4\n',offsets=[];for(let i=0;i<objs.length;i++){offsets.push(s.length);s+=(i+1)+' 0 obj\n'+objs[i]+'\nendobj\n'}const pos=s.length;s+='xref\n0 6\n0000000000 65535 f \n';for(const o of offsets)s+=String(o).padStart(10,'0')+' 00000 n \n';s+='trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+pos+'\n%%EOF';return new File([s],'Zipper-prueba-FunPrint.pdf',{type:'application/pdf'})}
document.getElementById('print').onclick=async()=>{const status=document.getElementById('status');try{const file=pdf();if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({files:[file]});status.textContent='Comprobante enviado al menú de compartir.'}else{status.textContent='Este navegador no admite compartir archivos PDF directamente.'}}catch(e){status.textContent=e.name==='AbortError'?'Se canceló el envío.':'Error al compartir: '+e.message}};
</script></body></html>
