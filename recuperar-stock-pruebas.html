<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar stock de pruebas</title><style>body{font:18px system-ui;padding:24px;max-width:520px;margin:auto;background:#f3f4f6}button,a{display:block;padding:18px;margin:20px 0;border-radius:12px;font:inherit}button{width:100%;background:#2563eb;color:white;border:0}p{line-height:1.5}</style><h1>Recuperar stock de pruebas</h1><p>Devuelve las unidades descontadas por los comprobantes del último borrado. Las ventas permanecen en cero. Cierra las otras pestañas de la app antes de continuar.</p><p id="status"></p><button id="restore">Recuperar unidades de prueba</button><a href="./">Volver a la aplicación</a><script>
function planRestore(backup,products){if(backup.stockRestored)throw Error('Este respaldo ya fue recuperado. No se volverán a sumar unidades.');const sales=JSON.parse(backup.data?.zipperComprobantes||'[]');if(!Array.isArray(sales)||!Array.isArray(products))throw Error('Respaldo inválido.');const counts=new Map();for(const s of sales){if(!Array.isArray(s.items))throw Error('Comprobante sin detalle.');for(const i of s.items){const id=String(i.baseProductId||i.productId||'');const qty=Number(i.qty);if(!id||!Number.isInteger(qty)||qty<0)throw Error('Cantidad o producto inválido.');let p=products.find(p=>String(p.id)===id);if(!p&&id.includes('::tabaco::'))p=products.find(p=>String(p.id)===id.split('::tabaco::')[0]);if(!p)throw Error('No se encontró el producto '+(i.desc||id)+'. No se modificó el stock.');if(!Number.isFinite(Number(p.stock))||Number(p.stock)<0)throw Error('Stock inválido.');counts.set(String(p.id),(counts.get(String(p.id))||0)+qty)}}return {products:products.map(p=>counts.has(String(p.id))?({...p,stock:Number(p.stock)+counts.get(String(p.id))}):({...p})),units:[...counts.values()].reduce((a,b)=>a+b,0),count:counts.size}}
const status=document.getElementById('status'),button=document.getElementById('restore');let backup,rawProducts,plan;
try{backup=JSON.parse(localStorage.getItem('zipperRespaldoAntesInicioVentas')||'null');if(!backup)throw Error('No se encontró el respaldo en este navegador.');rawProducts=localStorage.getItem('zipperProductos');plan=planRestore(backup,JSON.parse(rawProducts||'null'));status.textContent='Se recuperarán '+plan.units+' unidades en '+plan.count+' productos.';if(!plan.units)button.disabled=true}catch(e){status.textContent=e.message;button.disabled=true}
button.onclick=()=>{if(!confirm('¿Devolver '+plan.units+' unidades de prueba al stock? Las ventas seguirán en cero.'))return;button.disabled=true;let wrote=false;try{if(localStorage.getItem('zipperProductos')!==rawProducts)throw Error('El stock cambió. Recarga esta página antes de recuperar.');const current=JSON.parse(localStorage.getItem('zipperRespaldoAntesInicioVentas')||'null');if(JSON.stringify(current)!==JSON.stringify(backup))throw Error('El respaldo cambió. Recarga esta página.');localStorage.setItem('zipperProductos',JSON.stringify(plan.products));wrote=true;localStorage.setItem('zipperRespaldoAntesInicioVentas',JSON.stringify({...backup,stockRestored:true,stockRestoredAt:new Date().toISOString()}));status.textContent='Stock recuperado. Las ventas siguen en cero. Vuelve a la aplicación.';button.hidden=true}catch(e){if(wrote){try{localStorage.setItem('zipperProductos',rawProducts)}catch(rollback){status.textContent='Error al guardar y revertir. No repitas la recuperación; avisa para revisar.';return}}status.textContent=e.message}};
</script></html>
