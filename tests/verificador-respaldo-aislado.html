<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verificador aislado de respaldo · Distribuidora zipper</title>
<style>body{font:16px system-ui;max-width:780px;margin:30px auto;padding:16px;line-height:1.5}pre{white-space:pre-wrap;background:#f1f5f9;padding:16px;border-radius:10px}input{max-width:100%}</style></head>
<body><h1>Verificador aislado de respaldo</h1>
<p>Esta herramienta <strong>no restaura ni modifica</strong> la aplicación: solo lee un archivo JSON elegido por el usuario.</p>
<input type="file" id="file" accept=".json,application/json"><pre id="result">Seleccione un respaldo de ensayo para verificarlo.</pre>
<script>
const $=id=>document.getElementById(id);
const normal=s=>String(s||'').trim().toLocaleLowerCase('es');
function verify(doc){
 const errors=[],warnings=[];
 if(!doc||doc.app!=='Distribuidora zipper'||!doc.data||typeof doc.data!=='object')throw Error('No es un respaldo válido de Distribuidora zipper.');
 const d=doc.data,parse=k=>{if(typeof d[k]!=='string')throw Error('Falta '+k);const v=JSON.parse(d[k]);if(!Array.isArray(v))throw Error(k+' no es una lista');return v;};
 const clients=parse('zipperClientes'),sales=parse('zipperComprobantes'),products=parse('zipperProductos');
 const ids=new Set(),routePos=new Map(),routeIdentity=new Map(),weekCounts={A:0,B:0};
 clients.forEach((c,i)=>{
  if(!c||!String(c.id||'').trim()){errors.push('Cliente sin ID en fila '+(i+1));return;}
  if(ids.has(String(c.id)))errors.push('ID duplicado: '+c.id);ids.add(String(c.id));
  const routes={...(c.routeAssignments||{})};
  if(!routes.A&&c.routeWeek==='A'&&c.routeDay)routes.A={day:c.routeDay,position:c.routePosition};
  if(!routes.B&&c.routeWeekB&&c.routeDayB)routes.B={day:c.routeDayB,position:c.routePositionB};
  if(!routes.B&&c.routeWeek==='B'&&c.routeDay)routes.B={day:c.routeDay,position:c.routePosition};
  Object.entries(routes).forEach(([week,r])=>{
   if(!r||!r.day)return;
   if(week in weekCounts)weekCounts[week]++;
   const pos=Number(r.position),slot=week+' / '+normal(r.day)+' / '+pos;
   if(!Number.isInteger(pos)||pos<1)errors.push('Posición inválida: '+c.name+' '+slot);
   if(routePos.has(slot))errors.push('Posición repetida: '+slot+' ('+routePos.get(slot)+' / '+c.name+')');
   else routePos.set(slot,c.name);
   const identity=normal(c.name)+' / '+normal(c.address)+' / '+week+' / '+normal(r.day);
   if(routeIdentity.has(identity))warnings.push('Nombre, dirección y ruta duplicados: '+identity);
   routeIdentity.set(identity,true);
  });
 });
 const clientIds=new Set(clients.map(c=>String(c?.id??'')));
 const productIds=new Set(products.map(p=>String(p?.id??'')));
 const saleIds=new Set(sales.map(s=>String(s?.id??'')));
 sales.forEach((sale,i)=>{
  const cid=sale?.clienteId??sale?.clientId;
  if(cid!=null&&!clientIds.has(String(cid)))errors.push('Venta '+(i+1)+' referencia cliente inexistente: '+cid);
  (sale?.items||[]).forEach((item,j)=>{
   const pid=item?.baseProductId??item?.productId;
   if(pid!=null&&!productIds.has(String(pid)))warnings.push('Venta '+(i+1)+' producto histórico no presente en inventario: '+pid+' (ítem '+(j+1)+')');
  });
 });
 const payments=d.zipperPagos?parse('zipperPagos'):[];
 payments.forEach((p,i)=>{
  const cid=p?.clienteId??p?.clientId;
  if(cid!=null&&!clientIds.has(String(cid)))errors.push('Abono '+(i+1)+' referencia cliente inexistente: '+cid);
  if(p?.saleId!=null&&!saleIds.has(String(p.saleId)))errors.push('Abono '+(i+1)+' referencia venta inexistente: '+p.saleId);
 });
 return {clients:clients.length,sales:sales.length,products:products.length,payments:payments.length,weekCounts,errors,warnings};
}
$('file').addEventListener('change',async e=>{
 try{
  const f=e.target.files?.[0];if(!f)return;
  if(f.size>20*1024*1024)throw Error('Archivo mayor a 20 MB');
  const report=verify(JSON.parse(await f.text()));
  $('result').textContent='Clientes: '+report.clients+'\nComprobantes: '+report.sales+'\nProductos: '+report.products+'\nAsignaciones A: '+report.weekCounts.A+'\nAsignaciones B: '+report.weekCounts.B+'\n\nErrores: '+report.errors.length+'\n'+report.errors.join('\n')+'\n\nAvisos: '+report.warnings.length+'\n'+report.warnings.join('\n')+'\n\nEsta prueba NO verifica caja, historial ni restauración.';
 }catch(err){$('result').textContent='ERROR: '+err.message;}
});
</script></body></html>
